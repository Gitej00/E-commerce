<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra-like E-Commerce Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#shop">Shop</a></li>
            <li><a href="#cart">Cart</a></li>
            <li><a href="#comparison">Comparison</a></li>
        </ul>
    </nav>

    <section id="home">
        <div class="banner">
            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80" alt="Banner 1">
        </div>
        <div class="banner">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80" alt="Banner 2">
        </div>
        <div class="featured-products">
            <h2>Featured Products</h2>
            <div class="product-grid" id="featuredProducts"></div>
        </div>
    </section>

    <section id="shop">
        <h2>Shop</h2>
        <div class="filters">
            <button onclick="filterProducts('all')" class="active">All</button>
            <button onclick="filterProducts('men')">Men</button>
            <button onclick="filterProducts('women')">Women</button>
            <button onclick="filterProducts('electronics')">Electronics</button>
        </div>
        <div class="product-grid" id="shopProducts"></div>
    </section>

    <section id="cart">
        <h2>Cart</h2>
        <div id="cartItems"></div>
        <div id="cartTotal"></div>
    </section>

    <section id="comparison">
        <h2>Price Comparison</h2>
        <div id="comparisonTable"></div>
    </section>

    <footer>
        <p>&copy; 2023 Myntra-like E-Commerce Website. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
